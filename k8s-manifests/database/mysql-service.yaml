# MariaDB Service - Internal ClusterIP
# Backend connects using: mysql:3306
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app: mysql
    tier: database
    sandbox: learn-kubernetes
spec:
  type: ClusterIP
  selector:
    app: mysql
    tier: database
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
      name: mysql
