# Secret for MariaDB credentials
# Password: "admin" (base64 encoded: YWRtaW4=)
# 
# WARNING: This is for learning purposes only!
# In production, use:
# - External secret management (HashiCorp Vault, AWS Secrets Manager)
# - Sealed Secrets or External Secrets Operator
# - Generate random passwords with: openssl rand -base64 24
apiVersion: v1
kind: Secret
metadata:
  name: mysqlpassword
  labels:
    app: mysql
    tier: database
    sandbox: learn-kubernetes
type: Opaque
data:
  # echo -n "admin" | base64 = YWRtaW4=
  password: YWRtaW4=
